<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
    <rect width="1200" height="630" fill="#000000" />
    <!-- Navy ambient glow -->
    <circle cx="200" cy="150" r="400" fill="#070a14" />
    <!-- Plum ambient glow -->
    <circle cx="1000" cy="500" r="400" fill="#0d0716" />
    
    <!-- Scanlines -->
    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
        <rect width="10" height="2" fill="rgba(255,255,255,0.035)" />
    </pattern>
    <rect width="1200" height="630" fill="url(#scanlines)" />

    <!-- Border container -->
    <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#4a5aa8" stroke-width="4" />
    
    <!-- Title -->
    <text x="100" y="140" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#ffffff">HOWLCHANGEOPS<tspan fill="#39ff14">█</tspan></text>
    <text x="100" y="190" font-family="'Courier New', monospace" font-size="24" fill="#9a9aa3">// bounded change authority &amp; release boundary</text>

    <!-- Flow diagram -->
    <g transform="translate(100, 260)" font-family="'Courier New', monospace" font-size="32" font-weight="bold">
        <text x="0" y="0" fill="#ffffff">INTENT</text>
        <text x="50" y="45" fill="#4a5aa8">↓</text>
        
        <text x="0" y="90" fill="#ffffff">EVIDENCE</text>
        <text x="50" y="135" fill="#4a5aa8">↓</text>
        
        <text x="0" y="180" fill="#ffffff">AUTHORITY</text>
        <text x="50" y="225" fill="#4a5aa8">↓</text>
        
        <text x="0" y="270" fill="#ffffff">EXECUTION</text>
    </g>

    <!-- Core Message -->
    <rect x="650" y="270" width="450" height="120" fill="#0d0716" stroke="#4a4d5a" stroke-width="2" />
    <text x="690" y="335" font-family="'Courier New', monospace" font-size="28" font-style="italic" fill="#ffffff">Intent is not authority.</text>

    <!-- Footer -->
    <text x="100" y="540" font-family="'Courier New', monospace" font-size="20" fill="#9a9aa3">POWERED BY HOWLFRAME</text>
    <circle cx="1110" cy="533" r="8" fill="#39ff14" />
    <text x="1130" y="540" font-family="'Courier New', monospace" font-size="20" fill="#9a9aa3" text-anchor="end">STATUS: ACTIVE</text>
</svg>
