name: ChangeOps CI

on:
  push:
    branches: [ "main", "agent/changeops-v01" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Download HowlFrame v0.1.0
      run: |
        mkdir -p ~/.local/bin
        wget -q https://github.com/howlcipher/howlframe/releases/download/v0.1.0/howlframe_v0.1.0_linux_amd64.tar.gz
        tar -xzf howlframe_v0.1.0_linux_amd64.tar.gz -C ~/.local/bin/
        chmod +x ~/.local/bin/howlframe
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build adapter
      run: |
        cd adapter
        go build -o ../changeops

    - name: HowlFrame check and build
      run: |
        howlframe check src/changeops.howl
        howlframe build src/changeops.howl

    - name: Integration tests
      run: bash tests/integration_test.sh

    - name: Adversarial tests
      run: bash tests/adversarial_test.sh
